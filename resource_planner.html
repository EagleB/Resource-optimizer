<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Resource Planner</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --border:#d9dee7; --text:#1f2937; --muted:#6b7280;
    --accent:#2563eb; --accent-2:#1d4ed8; --ok:#bbf7d0; --ok-2:#16a34a; --under:#fecaca; --under-2:#dc2626;
    --over:#fde68a; --over-2:#d97706; --off:#eceff3; --rest:#e0e7ff;
    --radius:8px; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:14px/1.4 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg)}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;border:1px solid var(--border);background:var(--panel);padding:6px 12px;border-radius:6px}
  button:hover{background:#f0f3f8}
  button.primary{background:var(--accent);border-color:var(--accent-2);color:#fff;font-weight:600}
  button.primary:hover{background:var(--accent-2)}
  button.danger{color:#b91c1c}
  button.active{background:#dbeafe;border-color:var(--accent);color:var(--accent-2);font-weight:600}
  input[type=number],input[type=text],input[type=date],select{border:1px solid var(--border);border-radius:6px;padding:5px 7px;background:#fff}
  input[type=number]{width:70px}
  label{color:var(--muted);font-size:12px}

  header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
  header h1{font-size:18px;margin:0 16px 0 0}
  header .spacer{flex:1}
  .btngroup{display:flex;gap:0}
  .btngroup button{border-radius:0}
  .btngroup button:first-child{border-radius:6px 0 0 6px}
  .btngroup button:last-child{border-radius:0 6px 6px 0}
  .btngroup button+button{border-left:none}

  .layout{display:flex;height:calc(100% - 55px)}
  aside{width:420px;min-width:420px;background:var(--panel);border-right:1px solid var(--border);overflow:auto;padding:14px;transition:margin .2s}
  aside.collapsed{margin-left:-420px}
  main{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}

  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 8px}
  h2:first-child{margin-top:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
  .field{display:flex;flex-direction:column;gap:3px}
  .days{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .days label{display:flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:6px;padding:4px 8px;color:var(--text);cursor:pointer;background:#fff}
  .days label.on{background:#dbeafe;border-color:var(--accent)}

  table.people{width:100%;border-collapse:collapse;font-size:13px}
  table.people th{font-weight:600;color:var(--muted);font-size:11px;text-align:left;padding:4px 3px}
  table.people td{padding:3px}
  table.people input[type=text]{width:100%}
  table.people input[type=number]{width:56px}
  table.people select{width:70px}
  .swatch{width:16px;height:16px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.15);cursor:pointer}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px}
  .status{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .stat{display:flex;flex-direction:column}
  .stat b{font-size:18px}
  .stat span{font-size:11px;color:var(--muted)}
  .pill{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
  .pill.ok{background:var(--ok);color:#14532d}
  .pill.bad{background:var(--under);color:#7f1d1d}
  .pill.warn{background:var(--over);color:#78350f}
  ul.warnings{margin:8px 0 0;padding-left:18px;color:#7f1d1d;font-size:13px}
  ul.warnings li.soft{color:#78350f}

  .legend{display:flex;gap:12px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
  .legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}

  /* Week view */
  .week{display:grid;grid-template-columns:56px repeat(7,1fr);gap:4px;min-width:900px}
  .week .dh{text-align:center;font-weight:600;padding:6px 0;border-bottom:2px solid var(--border)}
  .week .dh small{display:block;font-weight:400;color:var(--muted);font-size:11px}
  .week .dh.off{color:var(--muted)}
  .week .hours{display:flex;flex-direction:column}
  .week .hours div{height:30px;font-size:11px;color:var(--muted);text-align:right;padding-right:6px;line-height:30px}
  .daycol{position:relative;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:#fff}
  .daycol.off{background:repeating-linear-gradient(45deg,#f1f3f6 0 8px,#e9ecf1 8px 16px)}
  .daycol .hrow{height:30px;border-bottom:1px solid #eef1f5}
  .daycol .hrow.under{background:var(--under)}
  .daycol .hrow.ok{background:var(--ok)}
  .daycol .hrow.over{background:var(--over)}
  .bar{position:absolute;border-radius:4px;color:#fff;font-size:11px;padding:8px 5px 3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-shadow:0 1px 2px rgba(0,0,0,.25);line-height:1.2;cursor:pointer}
  .bar small{display:block;opacity:.85}
  /* resize grabbers: a faint pill at each edge, fully visible while the mouse is anywhere over the block */
  .bar .rz{position:absolute;z-index:2;display:flex;align-items:center;justify-content:center;opacity:.35;transition:opacity .12s}
  .bar:hover .rz,.bar.resizing .rz{opacity:1}
  .bar .rz::before{content:"";display:block;background:#fff;border-radius:99px;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .bar .rz:hover::before,.bar.resizing .rz::before{background:#fde68a}
  .bar .rz.t,.bar .rz.b{left:0;right:0;height:10px;cursor:ns-resize}
  .bar .rz.t{top:0}.bar .rz.b{bottom:0}
  .bar .rz.t::before,.bar .rz.b::before{width:34px;height:4px}
  .bar .rz.l,.bar .rz.r{top:0;bottom:0;width:10px;cursor:ew-resize}
  .bar .rz.l{left:0}.bar .rz.r{right:0}
  .bar .rz.l::before,.bar .rz.r::before{width:4px;height:60%}
  .bar:hover{box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.35)}
  .bar.resizing{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent);z-index:3}
  .bar .ot{position:absolute;left:3px;right:3px;bottom:3px;background:rgba(255,255,255,.93);color:#b91c1c;font-weight:700;font-size:10px;line-height:1.3;border-radius:3px;text-align:center;padding:1px 3px;pointer-events:none}
  .track .bar .ot{left:auto;right:8px;top:50%;bottom:auto;transform:translateY(-50%)}

  /* Day view */
  .dayview{min-width:900px}
  .dayview .dsel{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .drow{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:8px;margin-bottom:6px}
  .drow .name{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
  .drow .name small{color:var(--muted);font-weight:400}
  .track{position:relative;height:34px;background:#f8fafc;border:1px solid var(--border);border-radius:6px}
  .track .tick{position:absolute;top:0;bottom:0;border-left:1px dashed #e2e6ee}
  .track .bar{top:4px;bottom:4px;padding:3px 12px;display:flex;align-items:center}
  .axis{display:grid;grid-template-columns:150px 1fr;gap:8px}
  .axis .cells,.covrow .cells{display:grid}
  .axis .cells div{font-size:11px;color:var(--muted);text-align:left;padding-left:3px}
  .covrow{display:grid;grid-template-columns:150px 1fr;gap:8px;margin-top:10px;align-items:center}
  .covrow .cells div{height:30px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border-right:1px solid #fff}
  .covrow .cells div.under{background:var(--under);color:#7f1d1d}
  .covrow .cells div.ok{background:var(--ok);color:#14532d}
  .covrow .cells div.over{background:var(--over);color:#78350f}

  /* Table view */
  table.plan{border-collapse:collapse;width:100%;font-size:13px}
  table.plan th,table.plan td{border:1px solid var(--border);padding:6px;text-align:center;vertical-align:middle}
  table.plan th{background:#f8fafc}
  table.plan td.name{text-align:left;font-weight:600;white-space:nowrap}
  table.plan td.rest{background:var(--rest)}
  table.plan td.bad{outline:2px solid var(--under-2);outline-offset:-2px}
  table.plan select{padding:3px 4px}
  table.plan td.tot{font-weight:600}
  table.plan td.tot.neg{color:var(--under-2)}
  table.plan tfoot td{font-size:12px}
  .hint{font-size:12px;color:var(--muted)}
  .bar[draggable]{cursor:grab}
  .dropok{outline:3px dashed var(--accent);outline-offset:-3px;background-color:#eff6ff!important}
  .grip{cursor:grab;color:var(--muted);font-size:16px;padding:0 4px;user-select:none}
  .grip:hover{color:var(--accent)}
  .dragging{opacity:.4}
  #tableCard h3{margin:0 0 8px;font-size:14px}
  .hidden{display:none!important}
  @media (max-width:1000px){
    .layout{flex-direction:column;height:auto}
    aside{width:100%;min-width:0;max-height:50vh;border-right:none;border-bottom:1px solid var(--border)}
    aside.collapsed{margin-left:0;display:none}
  }
  @media print{header,aside{display:none}.layout{height:auto}}
</style>
</head>
<body>
<header>
  <button id="togglePanel" title="Show/hide setup panel">☰</button>
  <h1>Weekly Resource Planner</h1>
  <button class="primary" id="btnOptimize">⚡ Optimize</button>
  <button id="btnClear">Clear plan</button>
  <span class="spacer"></span>
  <div class="btngroup">
    <button data-view="week" class="active">Week</button>
    <button data-view="day">Day</button>
  </div>
  <span class="spacer"></span>
  <button id="btnSave">💾 Save plan (.json)</button>
  <button id="btnLoad">📂 Load plan</button>
  <button id="btnCSV">📊 Export Excel (.csv)</button>
  <input type="file" id="fileInput" accept=".json,application/json" class="hidden">
</header>

<div class="layout">
  <aside id="panel">
    <h2>Week settings</h2>
    <div class="grid2">
      <div class="field"><label>Week starting (Monday)</label><input type="date" id="weekLabel"></div>
      <div></div>
      <div class="field"><label>Day start time</label><select id="windowStart"></select></div>
      <div class="field"><label>Day end time</label><select id="windowEnd"></select></div>
      <div class="field"><label>2nd resource starts at</label><select id="secondStart"></select></div>
      <div></div>
      <div class="field"><label>People required before 2nd start</label><input type="number" id="headcountBefore" min="0" max="20"></div>
      <div class="field"><label>People required after 2nd start</label><input type="number" id="headcountAfter" min="0" max="20"></div>
    </div>
    <h2>Working days</h2>
    <div class="field"><label>Number of working days per week</label><input type="number" id="wdCount" min="1" max="7"></div>
    <div class="days" id="wdBoxes"></div>

    <h2>People</h2>
    <table class="people">
      <thead><tr><th></th><th>Name</th><th>Hours/week</th><th>Max shift</th><th>Min shift</th><th>Rest day</th><th></th></tr></thead>
      <tbody id="peopleBody"></tbody>
    </table>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button id="btnAddPerson">+ Add person</button>
      <span class="spacer"></span>
      <button id="btnSample" title="Replace everything with the sample data">Load sample</button>
    </div>
    <p class="hint">Rest day is a preference: the optimizer honours it unless it is the only way to close a coverage gap (then it is flagged).</p>
  </aside>

  <main>
    <div class="card" id="statusCard"></div>
    <div class="card" id="mainCard"></div>
    <div class="card" id="tableCard"></div>
  </main>
</div>

<script>
(function(){
'use strict';
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAY_NAMES={Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday'};
const COLORS=['#2563eb','#16a34a','#d97706','#7c3aed','#db2777','#0891b2','#dc2626','#4b5563','#65a30d','#9333ea','#ea580c','#0d9488'];
const LS_KEY='resource_planner_v1';

let state=null;
const ui={view:'week',day:null};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const hh=h=>pad(h)+':00';
const uid=()=>'p'+Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function sampleState(){
  const mk=(name,h,mx,mn,rest,i)=>({id:uid(),name,weeklyHours:h,maxShift:mx,minShift:mn,restDay:rest,color:COLORS[i%COLORS.length]});
  const st={version:1,
    settings:{windowStart:8,windowEnd:20,secondStart:10,headcountBefore:1,headcountAfter:2,workingDays:['Mon','Tue','Wed','Thu','Fri'],weekLabel:''},
    people:[mk('Anna',40,8,4,null,0),mk('Marco',40,8,4,null,1),mk('Luca',32,8,4,'Wed',2),mk('Giulia',24,6,4,'Fri',3)],
    schedule:{}};
  return st;
}
function normalize(st){
  const s=st.settings||{};
  s.windowStart=clamp(+s.windowStart||0,0,23); s.windowEnd=clamp(+s.windowEnd||24,s.windowStart+1,24);
  s.secondStart=clamp(+s.secondStart||0,0,24);
  s.headcountBefore=clamp(+s.headcountBefore||0,0,50); s.headcountAfter=clamp(+s.headcountAfter||0,0,50);
  s.workingDays=DAYS.filter(d=>(s.workingDays||[]).includes(d)); if(!s.workingDays.length) s.workingDays=['Mon'];
  s.weekLabel=s.weekLabel||'';
  st.settings=s;
  st.people=(st.people||[]).map((p,i)=>({id:p.id||uid(),name:p.name||('Person '+(i+1)),weeklyHours:+p.weeklyHours||0,maxShift:+p.maxShift||8,minShift:+p.minShift||1,restDay:p.restDay||null,color:p.color||COLORS[i%COLORS.length]}));
  st.people.forEach(p=>{p.minShift=clamp(p.minShift,1,24);p.maxShift=clamp(p.maxShift,p.minShift,24);});
  const sch={}; st.people.forEach(p=>{sch[p.id]={}; const src=(st.schedule||{})[p.id]||{}; DAYS.forEach(d=>{const x=src[d]; if(x&&x.end>x.start) sch[p.id][d]={start:+x.start,end:+x.end};});});
  st.schedule=sch; st.version=1;
  return st;
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function persist(){ try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){} }
function restore(){ try{const j=localStorage.getItem(LS_KEY); if(j) return normalize(JSON.parse(j));}catch(e){} return null; }

function hours(){const s=state.settings,a=[];for(let h=s.windowStart;h<s.windowEnd;h++)a.push(h);return a;}
function need(h){const s=state.settings;return h<s.secondStart?s.headcountBefore:s.headcountAfter;}
function getShift(sched,pid,day){return (sched[pid]||{})[day]||null;}
function coverage(sched,day){const cov={};hours().forEach(h=>cov[h]=0);state.people.forEach(p=>{const sh=getShift(sched,p.id,day);if(sh)for(let h=sh.start;h<sh.end;h++)if(h in cov)cov[h]++;});return cov;}
function moveShift(fromPid,fromDay,toPid,toDay,newStart){
  const a=getShift(state.schedule,fromPid,fromDay);if(!a)return;
  const s=state.settings,len=a.end-a.start;
  let start=a.start;
  if(newStart!=null){start=clamp(newStart,s.windowStart,Math.max(s.windowStart,s.windowEnd-len));}
  const same=fromPid===toPid&&fromDay===toDay;
  if(same&&start===a.start)return;
  const b=same?null:getShift(state.schedule,toPid,toDay);
  if(!same){if(b)state.schedule[fromPid][fromDay]={...b};else delete state.schedule[fromPid][fromDay];}
  state.schedule[toPid][toDay]={start,end:start+len};
  persist();render();
}
function overtimeMap(){const m={};state.people.forEach(p=>{const o=assignedHours(state.schedule,p)-p.weeklyHours;if(o>0)m[p.id]=o;});return m;}
function assignedHours(sched,p){let t=0;DAYS.forEach(d=>{const sh=getShift(sched,p.id,d);if(sh)t+=sh.end-sh.start;});return t;}
function covClass(c,n){return c<n?'under':c>n?'over':'ok';}

/* ---------- analysis / objective ---------- */
function analyze(sched){
  const s=state.settings, H=hours();
  const r={uncovered:0,over:0,unused:0,restViol:0,hard:0,warnings:[],perDay:{},demand:0,budget:0};
  s.workingDays.forEach(d=>{
    const cov=coverage(sched,d); let g=0,o=0;
    H.forEach(h=>{const n=need(h);r.demand+=n;if(cov[h]<n)g+=n-cov[h];else if(cov[h]>n)o+=cov[h]-n;});
    r.uncovered+=g;r.over+=o;r.perDay[d]={gaps:g,over:o};
    if(g)r.warnings.push({t:`${DAY_NAMES[d]}: ${g} uncovered person-hour${g>1?'s':''}`,hard:true});
  });
  state.people.forEach(p=>{
    const a=assignedHours(sched,p); r.budget+=p.weeklyHours;
    if(a>p.weeklyHours){r.hard++;r.warnings.push({t:`${p.name}: ${a}h assigned, budget is ${p.weeklyHours}h`,hard:true});}
    else r.unused+=p.weeklyHours-a;
    DAYS.forEach(d=>{
      const sh=getShift(sched,p.id,d); if(!sh)return;
      const len=sh.end-sh.start;
      if(!s.workingDays.includes(d)){r.hard++;r.warnings.push({t:`${p.name}: shift on ${DAY_NAMES[d]}, which is not a working day`,hard:true});}
      if(len>p.maxShift){r.hard++;r.warnings.push({t:`${p.name} ${d}: shift of ${len}h exceeds max ${p.maxShift}h`,hard:true});}
      if(len<p.minShift){r.hard++;r.warnings.push({t:`${p.name} ${d}: shift of ${len}h is below min ${p.minShift}h`,hard:true});}
      if(sh.start<s.windowStart||sh.end>s.windowEnd){r.hard++;r.warnings.push({t:`${p.name} ${d}: shift ${hh(sh.start)}-${hh(sh.end)} is outside the ${hh(s.windowStart)}-${hh(s.windowEnd)} window`,hard:true});}
      if(p.restDay===d){r.restViol++;r.warnings.push({t:`${p.name}: works on preferred rest day (${DAY_NAMES[d]})`,hard:false});}
    });
  });
  return r;
}
function objective(sched){
  const s=state.settings,H=hours();let unc=0,over=0,unused=0,rest=0,hard=0;
  const used={};
  for(const d of s.workingDays){
    const cov={};for(const h of H)cov[h]=0;
    for(const p of state.people){const sh=sched[p.id][d];if(!sh)continue;const len=sh.end-sh.start;used[p.id]=(used[p.id]||0)+len;
      if(len>p.maxShift||len<p.minShift||sh.start<s.windowStart||sh.end>s.windowEnd)hard++;
      if(p.restDay===d)rest++;
      for(let h=sh.start;h<sh.end;h++)if(h in cov)cov[h]++;}
    for(const h of H){const n=need(h);if(cov[h]<n){unc+=n-cov[h];if(cov[h]===0&&n>0)unc+=1;}else over+=cov[h]-n;} // an hour with nobody at all costs extra
  }
  for(const p of state.people){const u=used[p.id]||0;if(u>p.weeklyHours)hard++;else unused+=p.weeklyHours-u;}
  return hard*100000+unc*1000+over*10+unused+rest*5;
}

/* ---------- optimizer ---------- */
function optimize(){
  const s=state.settings,people=state.people,days=s.workingDays,H=hours();
  if(!people.length){alert('Add at least one person first.');return;}
  let seed=987654321;const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  const emptySched=()=>{const o={};people.forEach(p=>o[p.id]={});return o;};

  function construct(iter){
    const sched=emptySched(),rem={},worked={};
    people.forEach(p=>{rem[p.id]=p.weeklyHours;worked[p.id]=0;});
    const order=days.slice(); if(iter%4===2)order.reverse(); else if(iter>3){for(let i=order.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[order[i],order[j]]=[order[j],order[i]];}}
    const cov={};order.forEach(d=>{cov[d]={};H.forEach(h=>cov[d][h]=0);});
    // day-major fills one day completely before the next; hour-major spreads people across days (better when budget is short)
    const slots=[];
    if(iter%2===0)order.forEach(d=>H.forEach(h=>slots.push([d,h]))); else H.forEach(h=>order.forEach(d=>slots.push([d,h])));
    for(const [day,h] of slots){
      const c=cov[day];let guard=0;
      while(c[h]<need(h)&&guard++<20){
        const cands=people.filter(p=>p.restDay!==day&&!sched[p.id][day]&&rem[p.id]>=p.minShift);
        if(!cands.length)break;
        const sc=new Map();cands.forEach(x=>sc.set(x.id,(rem[x.id]/Math.max(1,x.weeklyHours))*10-worked[x.id]*1.5+(iter>1?rnd()*5:rnd()*0.01)));
        cands.sort((a,b)=>sc.get(b.id)-sc.get(a.id));
        const p=cands[0];
        let start=h;
        if(s.windowEnd-start<p.minShift)start=Math.max(s.windowStart,s.windowEnd-p.minShift);
        const cap=Math.min(p.maxShift,rem[p.id],s.windowEnd-start);
        if(cap<p.minShift)break;
        let last=-1;for(let k=0;k<cap;k++){const x=start+k;if(c[x]<need(x))last=k;}
        let L=Math.max(last<0?p.minShift:last+1,p.minShift);
        if(iter>1&&rnd()<0.25)L=L+1+Math.floor(rnd()*2);
        L=Math.min(L,cap);
        sched[p.id][day]={start,end:start+L};
        rem[p.id]-=L;worked[p.id]++;
        for(let k=start;k<start+L;k++)c[k]++;
      }
    }
    return sched;
  }

  function repair(sched){
    let cur=objective(sched),improved=true,passes=0;
    const tryMove=(apply,undo)=>{apply();const v=objective(sched);if(v<cur){cur=v;return true;}undo();return false;};
    while(improved&&passes++<60){
      improved=false;
      for(const d of days){
        for(const p of people){
          const sh=sched[p.id][d];
          if(sh){
            const o={...sh};
            // extend / shrink at both ends
            const variants=[{start:o.start,end:o.end+1},{start:o.start-1,end:o.end},{start:o.start,end:o.end-1},{start:o.start+1,end:o.end},{start:o.start-1,end:o.end-1},{start:o.start+1,end:o.end+1}];
            for(const v of variants){
              if(v.start<s.windowStart||v.end>s.windowEnd||v.end-v.start<p.minShift||v.end-v.start>p.maxShift)continue;
              if(tryMove(()=>{sched[p.id][d]=v;},()=>{sched[p.id][d]=o;})){improved=true;break;}
            }
            // remove
            if(tryMove(()=>{delete sched[p.id][d];},()=>{sched[p.id][d]=o;}))improved=true;
          }else{
            // add a shift anywhere on this day (rest day allowed, penalised by objective)
            let bestV=null,bestObj=cur;
            for(let st=s.windowStart;st<s.windowEnd;st++){
              for(let L=p.minShift;L<=p.maxShift&&st+L<=s.windowEnd;L++){
                sched[p.id][d]={start:st,end:st+L};const v=objective(sched);
                if(v<bestObj){bestObj=v;bestV={start:st,end:st+L};}
              }
            }
            delete sched[p.id][d];
            if(bestV){sched[p.id][d]=bestV;cur=bestObj;improved=true;}
          }
        }
      }
    }
    return cur;
  }

  let best=null;const t0=Date.now();
  for(let iter=0;iter<60;iter++){
    const sched=construct(iter);const obj=repair(sched);
    if(!best||obj<best.obj)best={sched,obj};
    if(best.obj<1000&&iter>=10)break;   // no gaps: good enough
    if(Date.now()-t0>4000)break;
  }
  state.schedule=best.sched;
  ui.view=ui.view||'week';
  persist();render();
}

/* ---------- main views ---------- */
function render(){

}
function renderStatus(){
  const a=analyze(state.schedule),s=state.settings;
  const st=a.uncovered?'bad':(a.hard?'bad':(a.over||a.restViol?'warn':'ok'));
  const label=a.hard?'Constraint violations':a.uncovered?'Coverage gaps':a.over||a.restViol?'Complete (with notes)':'Complete';
  const demandNote=a.demand>a.budget?` <span class="pill bad">Demand ${a.demand}h &gt; budget ${a.budget}h — the week cannot be fully covered</span>`:'';
  const warns=a.warnings.length?`<ul class="warnings">${a.warnings.slice(0,25).map(w=>`<li class="${w.hard?'':'soft'}">${esc(w.t)}</li>`).join('')}${a.warnings.length>25?`<li class="soft">… ${a.warnings.length-25} more</li>`:''}</ul>`:'';
  $('#statusCard').innerHTML=`<div class="status">
    <span class="pill ${st}">${label}</span>
    <div class="stat"><b>${a.demand}h</b><span>required (${s.workingDays.length} days)</span></div>
    <div class="stat"><b>${a.budget}h</b><span>available budget</span></div>
    <div class="stat"><b>${a.budget-a.unused}h</b><span>planned</span></div>
    <div class="stat"><b style="color:${a.uncovered?'var(--under-2)':'inherit'}">${a.uncovered}</b><span>uncovered person-hours</span></div>
    <div class="stat"><b style="color:${a.over?'var(--over-2)':'inherit'}">${a.over}</b><span>over-staffed person-hours</span></div>
    <div class="stat"><b>${a.unused}h</b><span>unused budget</span></div>
    ${demandNote}
    <span class="spacer"></span>
    <div class="legend"><span><i style="background:var(--under)"></i>under-staffed</span><span><i style="background:var(--ok)"></i>required met</span><span><i style="background:var(--over)"></i>over-staffed</span></div>
  </div>${warns}`;
}
function dateOf(day){const s=state.settings;if(!s.weekLabel)return '';const d=new Date(s.weekLabel+'T00:00:00');if(isNaN(d))return '';d.setDate(d.getDate()+DAYS.indexOf(day));return d.toLocaleDateString(undefined,{day:'2-digit',month:'short'});}
function lanes(shifts){const ends=[];shifts.sort((a,b)=>a.sh.start-b.sh.start||a.sh.end-b.sh.end);shifts.forEach(x=>{let l=ends.findIndex(e=>e<=x.sh.start);if(l<0){l=ends.length;ends.push(0);}ends[l]=x.sh.end;x.lane=l;});return ends.length;}

function weekHTML(){
  const s=state.settings,H=hours(),RH=30,ot=overtimeMap();
  let out='<div class="week"><div></div>';
  DAYS.forEach(d=>{const on=s.workingDays.includes(d);out+=`<div class="dh ${on?'':'off'}">${DAY_NAMES[d]}<small>${dateOf(d)||(on?'':'not working')}</small></div>`;});
  out+='<div class="hours">'+H.map(h=>`<div>${hh(h)}</div>`).join('')+'</div>';
  DAYS.forEach(d=>{
    const on=s.workingDays.includes(d);
    const cov=coverage(state.schedule,d);
    out+=`<div class="daycol ${on?'':'off'}" style="height:${H.length*RH}px" ${on?`data-drop="*|${d}" data-axis="y"`:''}>`;
    if(on)out+=H.map(h=>`<div class="hrow ${covClass(cov[h],need(h))}" title="${hh(h)}: ${cov[h]} / ${need(h)} required"></div>`).join('');
    const shifts=state.people.map(p=>({p,sh:getShift(state.schedule,p.id,d)})).filter(x=>x.sh);
    const n=lanes(shifts)||1;
    shifts.forEach(x=>{
      const top=(x.sh.start-s.windowStart)*RH,h=(x.sh.end-x.sh.start)*RH;
      const w=100/n,left=x.lane*w;
      out+=`<div class="bar" style="top:${top+1}px;height:${h-3}px;left:calc(${left}% + 2px);width:calc(${w}% - 4px);background:${x.p.color}" title="${esc(x.p.name)} ${hh(x.sh.start)}-${hh(x.sh.end)} — drag to another day" draggable="true" data-drag="${x.p.id}|${d}" data-edit="${x.p.id}|${d}"><div class="rz t" data-edge="start" data-axis="y" title="Drag to change start"></div><span class="lbl">${esc(x.p.name)}<small>${hh(x.sh.start)}–${hh(x.sh.end)}</small></span>${ot[x.p.id]?`<div class="ot">OT: ${ot[x.p.id]}h</div>`:''}<div class="rz b" data-edge="end" data-axis="y" title="Drag to change end"></div></div>`;
    });
    out+='</div>';
  });
  out+='</div><p class="hint">Drag the top/bottom edge of a shift to change its start/end, drag the shift up/down to change its time, or onto another day to move it (the time follows where you drop it; dropping on a day where the person already works swaps the two shifts). Click a shift to jump to its cell in the table below.</p>';
  return out;
}
function dayHTML(){
  const s=state.settings,H=hours();
  if(!ui.day||!s.workingDays.includes(ui.day))ui.day=s.workingDays[0];
  const d=ui.day,cov=coverage(state.schedule,d),cols=`grid-template-columns:repeat(${H.length},1fr)`,ot=overtimeMap();
  let out=`<div class="dayview"><div class="dsel"><button data-dnav="-1">‹</button><select id="daySel">${s.workingDays.map(x=>`<option value="${x}" ${x===d?'selected':''}>${DAY_NAMES[x]} ${dateOf(x)}</option>`).join('')}</select><button data-dnav="1">›</button></div>`;
  out+=`<div class="axis"><div></div><div class="cells" style="${cols}">${H.map(h=>`<div>${hh(h)}</div>`).join('')}</div></div>`;
  state.people.forEach(p=>{
    const sh=getShift(state.schedule,p.id,d);
    const rest=p.restDay===d?'<small>(rest day)</small>':'';
    out+=`<div class="drow"><div class="name"><span class="swatch" style="background:${p.color}"></span>${esc(p.name)} ${rest}</div><div class="track" data-drop="${p.id}|${d}" data-axis="x">`;
    out+=H.map((h,i)=>`<div class="tick" style="left:${i/H.length*100}%"></div>`).join('');
    if(sh){const l=(sh.start-s.windowStart)/H.length*100,w=(sh.end-sh.start)/H.length*100;out+=`<div class="bar" style="left:${l}%;width:${w}%;background:${p.color}" draggable="true" data-drag="${p.id}|${d}" data-edit="${p.id}|${d}"><div class="rz l" data-edge="start" data-axis="x" title="Drag to change start"></div><span class="lbl">${hh(sh.start)}–${hh(sh.end)} (${sh.end-sh.start}h)</span>${ot[p.id]?`<div class="ot">OT: ${ot[p.id]}h</div>`:''}<div class="rz r" data-edge="end" data-axis="x" title="Drag to change end"></div></div>`;}
    out+='</div></div>';
  });
  out+=`<div class="covrow"><div class="name">Coverage / required</div><div class="cells" style="${cols}">${H.map(h=>`<div class="${covClass(cov[h],need(h))}">${cov[h]}/${need(h)}</div>`).join('')}</div></div>`;
  out+='<p class="hint">Drag the left/right edge of a shift to change its start/end, drag the shift left/right to change its time, onto another row to give it to another person, or onto a cell of the table below to move it to another day. Click a shift to jump to its cell in the table.</p></div>';
  return out;
}
function tableHTML(){
  const s=state.settings,H=hours(),wd=s.workingDays;
  const opt=(from,to,val)=>{let o='';for(let h=from;h<=to;h++)o+=`<option value="${h}" ${h===val?'selected':''}>${hh(h)}</option>`;return o;};
  let out=`<table class="plan"><thead><tr><th>Person</th>${wd.map(d=>`<th>${DAY_NAMES[d]}<br><small>${dateOf(d)}</small></th>`).join('')}<th>Planned</th><th>Budget</th><th>Remaining</th></tr></thead><tbody>`;
  state.people.forEach(p=>{
    const tot=assignedHours(state.schedule,p),rem=p.weeklyHours-tot;
    out+=`<tr><td class="name"><span class="swatch" style="background:${p.color}"></span> ${esc(p.name)}<br><small class="hint">max ${p.maxShift}h · min ${p.minShift}h</small></td>`;
    wd.forEach(d=>{
      const sh=getShift(state.schedule,p.id,d);const rest=p.restDay===d;
      const len=sh?sh.end-sh.start:0;const bad=sh&&(len>p.maxShift||len<p.minShift||sh.start<s.windowStart||sh.end>s.windowEnd);
      const startMin=Math.min(s.windowStart,sh?sh.start:99),endMax=Math.max(s.windowEnd,sh?sh.end:0);
      out+=`<td class="${rest?'rest':''} ${bad?'bad':''}" title="${rest?'Preferred rest day':''}" data-drop="${p.id}|${d}">
        ${sh?`<span class="grip" draggable="true" data-drag="${p.id}|${d}" title="Drag to another cell">⠿</span>`:''}<select data-cell="${p.id}|${d}|start"><option value="">Off</option>${opt(startMin,endMax-1,sh?sh.start:null)}</select>
        <select data-cell="${p.id}|${d}|end" ${sh?'':'disabled'}>${sh?opt(sh.start+1,endMax,sh.end):''}</select>
        ${sh?`<div class="hint">${len}h</div>`:''}</td>`;
    });
    out+=`<td class="tot">${tot}h</td><td>${p.weeklyHours}h</td><td class="tot ${rem<0?'neg':''}">${rem}h</td></tr>`;
  });
  out+='</tbody><tfoot><tr><td class="name">Coverage</td>';
  wd.forEach(d=>{const cov=coverage(state.schedule,d);let g=0,o=0;H.forEach(h=>{const n=need(h);if(cov[h]<n)g+=n-cov[h];else o+=cov[h]-n;});
    out+=`<td><span class="pill ${g?'bad':o?'warn':'ok'}">${g?g+' gap h':'covered'}</span>${o?`<div class="hint">+${o}h over</div>`:''}</td>`;});
  out+='<td colspan="3"></td></tr></tfoot></table><p class="hint">Choose "Off" to remove a shift, or drag a shift with ⠿ to another cell (day or person). Changes are reflected immediately in the calendar above. Blue cells are preferred rest days.</p>';
  return out;
}

/* ---------- export / import ---------- */
function download(name,content,type){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function fileStem(){return 'week_plan_'+(state.settings.weekLabel||new Date().toISOString().slice(0,10));}
function exportCSV(){
  const s=state.settings,H=hours(),wd=s.workingDays,q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[['sep=;']];
  rows.push(['Weekly plan',s.weekLabel?'Week of '+s.weekLabel:'']);
  rows.push(['Day window',hh(s.windowStart)+'-'+hh(s.windowEnd),'2nd resource from',hh(s.secondStart),'Required before/after',s.headcountBefore+'/'+s.headcountAfter]);
  rows.push([]);
  rows.push(['Person',...wd.map(d=>DAY_NAMES[d]+(dateOf(d)?' '+dateOf(d):'')),'Planned h','Budget h','Remaining h','Max shift','Min shift','Rest day']);
  state.people.forEach(p=>{const t=assignedHours(state.schedule,p);
    rows.push([p.name,...wd.map(d=>{const sh=getShift(state.schedule,p.id,d);return sh?hh(sh.start)+'-'+hh(sh.end):(p.restDay===d?'REST':'OFF');}),t,p.weeklyHours,p.weeklyHours-t,p.maxShift,p.minShift,p.restDay||'']);});
  rows.push([]);
  rows.push(['Hourly coverage (present/required)',...wd.map(d=>DAY_NAMES[d])]);
  const covs={};wd.forEach(d=>covs[d]=coverage(state.schedule,d));
  H.forEach(h=>rows.push([hh(h)+'-'+hh(h+1),...wd.map(d=>covs[d][h]+'/'+need(h))]));
  const csv='﻿'+rows.map((r,i)=>i===0?r[0]:r.map(q).join(';')).join('\r\n');
  download(fileStem()+'.csv',csv,'text/csv;charset=utf-8');
}
function saveJSON(){download(fileStem()+'.json',JSON.stringify(state,null,2),'application/json');}
function loadJSON(file){
  const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||typeof j!=='object'||!j.settings||!Array.isArray(j.people))throw new Error('Not a resource planner file');state=normalize(j);ui.day=null;persist();renderSettings();render();}catch(e){alert('Could not load file: '+e.message);}};
  r.readAsText(file);
}

/* ---------- events ---------- */
function bind(){
  $('#togglePanel').onclick=()=>$('#panel').classList.toggle('collapsed');
  $('#btnOptimize').onclick=()=>{readSettings();optimize();};

  $('#btnSave').onclick=saveJSON;
  $('#btnCSV').onclick=exportCSV;
  $('#btnLoad').onclick=()=>$('#fileInput').click();
  $('#fileInput').onchange=e=>{if(e.target.files[0])loadJSON(e.target.files[0]);e.target.value='';};

  // settings
  ['windowStart','windowEnd','secondStart','headcountBefore','headcountAfter','weekLabel'].forEach(id=>$('#'+id).addEventListener('change',()=>{readSettings();persist();render();}));

  $('#wdBoxes').addEventListener('change',()=>{const sel=[...document.querySelectorAll('#wdBoxes input:checked')].map(i=>i.dataset.day);if(!sel.length){renderSettings();return;}state.settings.workingDays=DAYS.filter(d=>sel.includes(d));state.people.forEach(p=>{if(p.restDay&&!state.settings.workingDays.includes(p.restDay))p.restDay=null;});persist();renderSettings();render();});

  // people
  $('#peopleBody').addEventListener('change',e=>{
    const tr=e.target.closest('tr');if(!tr)return;const p=state.people.find(x=>x.id===tr.dataset.pid);if(!p)return;
    const f=e.target.dataset.f;if(!f)return;
    if(f==='name')p.name=e.target.value.trim()||p.name;
    else if(f==='restDay')p.restDay=e.target.value||null;
    else{p[f]=clamp(+e.target.value||0,f==='weeklyHours'?0:1,f==='weeklyHours'?168:24);}
    if(p.maxShift<p.minShift){p.maxShift=p.minShift;}
    tr.querySelector('[data-f=maxShift]').value=p.maxShift;tr.querySelector('[data-f=minShift]').value=p.minShift;tr.querySelector('[data-f=weeklyHours]').value=p.weeklyHours;
    persist();render();
  });
  $('#peopleBody').addEventListener('click',e=>{
    const tr=e.target.closest('tr');if(!tr)return;const p=state.people.find(x=>x.id===tr.dataset.pid);if(!p)return;
    if(e.target.matches('[data-del]')){if(!confirm(`Remove ${p.name}?`))return;state.people=state.people.filter(x=>x!==p);delete state.schedule[p.id];persist();renderPeople();render();}
    else if(e.target.matches('.swatch')){p.color=COLORS[(COLORS.indexOf(p.color)+1)%COLORS.length];e.target.style.background=p.color;persist();render();}
  });
  $('#btnAddPerson').onclick=()=>{const i=state.people.length;const p={id:uid(),name:'Person '+(i+1),weeklyHours:40,maxShift:8,minShift:4,restDay:null,color:COLORS[i%COLORS.length]};state.people.push(p);state.schedule[p.id]={};persist();renderPeople();render();};
  $('#btnSample').onclick=()=>{if(confirm('Replace current settings, people and plan with the sample data?')){state=sampleState();ui.day=null;persist();renderSettings();render();}};

  // main card: table edits, day nav, bar clicks
  const main=document.querySelector('main');
  main.addEventListener('change',e=>{
    if(e.target.id==='daySel'){ui.day=e.target.value;render();return;}
    const c=e.target.dataset.cell;if(!c)return;
    const [pid,day,which]=c.split('|');const cur=getShift(state.schedule,pid,day);const s=state.settings;
    const p=state.people.find(x=>x.id===pid);
    if(which==='start'){
      if(e.target.value===''){delete state.schedule[pid][day];}
      else{const st=+e.target.value;let en=cur?cur.end:Math.min(s.windowEnd,st+p.maxShift);if(en<=st)en=Math.min(s.windowEnd,st+p.maxShift);if(en<=st)en=st+1;state.schedule[pid][day]={start:st,end:en};}
    }else{state.schedule[pid][day]={start:cur.start,end:+e.target.value};}
    persist();render();
  });

    const nav=e.target.closest('[data-dnav]');
    if(nav){const wd=state.settings.workingDays;let i=wd.indexOf(ui.day)+(+nav.dataset.dnav);i=(i+wd.length)%wd.length;ui.day=wd[i];render();return;}

  });

  // resize: drag the edge of a bar to change its start or end (pointer events, committed on release)
  let rz=null;
  const RH=30;
  function applyResize(r){
    const s=state.settings,H=hours(),{start,end}=r.cur,len=end-start;
    if(r.axis==='y'){r.bar.style.top=((start-s.windowStart)*RH+1)+'px';r.bar.style.height=(len*RH-3)+'px';r.bar.querySelector('.lbl small').textContent=hh(start)+'–'+hh(end);}
    else{r.bar.style.left=((start-s.windowStart)/H.length*100)+'%';r.bar.style.width=(len/H.length*100)+'%';r.bar.querySelector('.lbl').textContent=`${hh(start)}–${hh(end)} (${len}h)`;}
  }
  main.addEventListener('pointerdown',e=>{
    const h=e.target.closest('.rz');if(!h||e.button!==0)return;
    e.preventDefault();e.stopPropagation();
    const bar=h.closest('.bar');const [pid,day]=bar.dataset.edit.split('|');
    const sh=getShift(state.schedule,pid,day);if(!sh)return;
    const axis=h.dataset.axis,rect=bar.parentElement.getBoundingClientRect(),H=hours();
    rz={bar,pid,day,edge:h.dataset.edge,axis,pph:axis==='y'?RH:rect.width/H.length,orig:{...sh},cur:{...sh},x0:e.clientX,y0:e.clientY};
    bar.draggable=false;bar.classList.add('resizing');
    try{h.setPointerCapture(e.pointerId);}catch(_){}
  });
  main.addEventListener('pointermove',e=>{
    if(!rz)return;
    const d=Math.round((rz.axis==='y'?e.clientY-rz.y0:e.clientX-rz.x0)/rz.pph);
    const s=state.settings;let {start,end}=rz.orig;
    if(rz.edge==='start')start=clamp(start+d,s.windowStart,end-1);else end=clamp(end+d,start+1,s.windowEnd);
    rz.cur={start,end};applyResize(rz);
  });
  const endResize=()=>{if(!rz)return;const r=rz;rz=null;if(r.cur.start!==r.orig.start||r.cur.end!==r.orig.end){state.schedule[r.pid][r.day]={...r.cur};persist();}render();};
  main.addEventListener('pointerup',endResize);
  main.addEventListener('pointercancel',endResize);

  // drag & drop: move a shift to another day (week view / table cell) or another person (table cell)
  let dragSrc=null;
  main.addEventListener('dragstart',e=>{
    const el=e.target.closest('[data-drag]');if(!el)return;
    const bar=el.closest('.bar'),r=el.getBoundingClientRect();
    const [pid,day]=el.dataset.drag.split('|');const sh=getShift(state.schedule,pid,day)||{start:0,end:1};
    const len=sh.end-sh.start;
    // grab offset in hours from the start of the bar, so the shift lands where the user drops it
    dragSrc={key:el.dataset.drag,offY:bar?Math.floor((e.clientY-r.top)/(r.height/len)):0,offX:bar?Math.floor((e.clientX-r.left)/(r.width/len)):0,len};
    e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragSrc.key);
    (bar||el.closest('td')).classList.add('dragging');
  });
  main.addEventListener('dragend',()=>{dragSrc=null;main.querySelectorAll('.dragging,.dropok').forEach(x=>x.classList.remove('dragging','dropok'));});
  main.addEventListener('dragover',e=>{
    const t=e.target.closest('[data-drop]');if(!t||!dragSrc)return;
    e.preventDefault();e.dataTransfer.dropEffect='move';
    main.querySelectorAll('.dropok').forEach(x=>{if(x!==t)x.classList.remove('dropok');});t.classList.add('dropok');
  });
  main.addEventListener('dragleave',e=>{const t=e.target.closest('[data-drop]');if(t&&!t.contains(e.relatedTarget))t.classList.remove('dropok');});
  main.addEventListener('drop',e=>{
    const t=e.target.closest('[data-drop]');if(!t||!dragSrc)return;
    e.preventDefault();
    const [fromPid,fromDay]=dragSrc.key.split('|');let [toPid,toDay]=t.dataset.drop.split('|');
    if(toPid==='*')toPid=fromPid;
    const H=hours(),r=t.getBoundingClientRect();let newStart=null;
    if(t.dataset.axis==='y')newStart=state.settings.windowStart+Math.floor((e.clientY-r.top)/(r.height/H.length))-dragSrc.offY;
    else if(t.dataset.axis==='x')newStart=state.settings.windowStart+Math.floor((e.clientX-r.left)/(r.width/H.length))-dragSrc.offX;
    moveShift(fromPid,fromDay,toPid,toDay,newStart);
  });
}

/* ---------- init ---------- */
state=restore()||sampleState();
bind();renderSettings();render();
})();
</script>
</body>
</html>
